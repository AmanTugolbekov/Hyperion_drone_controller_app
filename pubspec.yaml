name: alatoo_drone
description: Ala-Too International University drone controller.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  permission_handler: ^13.0.2
  network_info_plus: ^8.2.2
  sensors_plus: ^7.1.1
  path_provider: ^2.1.3
  gal: ^2.3.0
  google_fonts: ^9.0.0
  wakelock_plus: ^1.8.1

  # The drone serves its camera as RTSP/MJPEG, which needs an FFmpeg-backed
  # player rather than the raw-JPEG reader used for the UDP clones.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
